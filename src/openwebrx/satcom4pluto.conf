# /etc/satcom4pluto.conf -- satcom4pluto, Linux side (after a change: sudo systemctl restart satcom4pluto)
#
# The radio settings (centre 255 MHz, 36.864 MS/s, gain) and the detector options
# (-f band, --max-snr-db jammer limit, --spur ...) are set in OpenWebRX:
# Settings -> SDR devices and profiles -> the satcom4pluto device.

# Pluto address on its USB network and its root password. Used to load the satcom4pluto FPGA image
# and detector into the Pluto's RAM after every Pluto power-up (its firmware is never changed).
PLUTO=192.168.5.5
PLUTO_PASSWORD=analog

# OpenWebRX docker container (filled in by the installer). If the container is re-created
# (image update) and has lost the satcom4pluto files, they are put back automatically.
OWRX_CONTAINER=
